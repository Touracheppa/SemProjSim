controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    flipper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
arm_controller:
  ros__parameters:
    joints:
    - arm_joint_1
    - arm_joint_2
    - arm_joint_3
    - arm_joint_4
    - arm_joint_5
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
gripper_controller:
  ros__parameters:
    joints:
    - Grip
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
flipper_controller:
  ros__parameters:
    joints:
    - flipper_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
